<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cloud MFA Demo{% endblock %}</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #172033; background: #f2f5fb; }
    body { margin: 0; }
    header { background: #14284b; color: white; padding: 18px 24px; }
    header strong { font-size: 19px; }
    main { max-width: 560px; margin: 38px auto; padding: 0 16px; }
    .card { background: white; padding: 28px; border-radius: 14px; box-shadow: 0 8px 28px #15284b12; }
    h1 { margin-top: 0; font-size: 25px; }
    p { line-height: 1.55; }
    label { display: block; margin: 15px 0 6px; font-weight: bold; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbd3e1; border-radius: 8px; font-size: 16px; }
    button, .button { display: inline-block; margin-top: 18px; padding: 12px 16px; background: #2457c5; color: white; border: 0; border-radius: 8px; font-size: 16px; text-decoration: none; cursor: pointer; }
    .notice { background: #fff4d8; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
    .muted { color: #596579; font-size: 14px; }
    .center { text-align: center; }
    .qr { max-width: 230px; width: 100%; height: auto; }
    code { overflow-wrap: anywhere; background: #eef2fa; padding: 5px; border-radius: 4px; }
    a { color: #2457c5; }
    footer { color: #687386; font-size: 12px; text-align: center; margin: 22px; }
  </style>
</head>
<body>
<header><strong>☁ Cloud MFA Demo</strong></header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  <section class="card">{% block content %}{% endblock %}</section>
</main>
<footer>College demonstration project · Do not use with real accounts or sensitive data</footer>
</body>
</html>
